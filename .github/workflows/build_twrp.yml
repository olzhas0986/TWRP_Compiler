name: TWRP Compiler

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    container:
      image: ubuntu:20.04
      options: --privileged

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Free Disk Space
      run: |
        apt-get update && apt-get install -y sudo
        sudo apt-get remove -y '^ghc-.*' '^dotnet-.*' '^llvm-.*' 'php.*' 'node.*' 'gfortran.*' || true
        sudo apt-get autoremove -y
        sudo apt-get clean
        rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost || true

    - name: Install Base Utilities & Dependencies
      run: |
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y \
          git-core gnupg flex bison build-essential zip curl zlib1g-dev \
          libc6-dev-i386 libncurses5 x11proto-core-dev libx11-dev libgl1-mesa-dev \
          libxml2-utils xsltproc unzip fontconfig python3 python-is-python3 sudo bash ca-certificates rsync

        mkdir -p /usr/local/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > /usr/local/bin/repo
        chmod a+rx /usr/local/bin/repo

    - name: Run Build Script
      run: |
        chmod +x ./build.sh
        ./build.sh

    - name: Export DEVICE Variable
      run: |
        DEVICE=$(grep 'export DEVICE=' build.sh | cut -d'=' -f2)
        echo "DEVICE=$DEVICE" >> $GITHUB_ENV

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-${{ env.DEVICE }}-boot
        path: twrp/out/target/product/${{ env.DEVICE }}/boot.img
        if-no-files-found: warn
